[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acd"
version = "0.1.0"
description = "Assistente de Candidaturas do Daniel"
requires-python = ">=3.14"

dependencies = [
    "keyring>=25.6.0,<26",
    "openai>=2.46.0,<3",
    "openpyxl>=3.1.5,<4",
    "pandas>=3.0.3,<4",
    "playwright>=1.62.0,<2",
    "psutil>=7.2.2,<8",
    "pydantic>=2.13.4,<3",
    "PySide6>=6.11.1,<7",
    "python-docx>=1.2.0,<2",
    "SQLAlchemy>=2.0.51,<3",
]

[project.optional-dependencies]
dev = [
    "build>=1.3.0,<2",
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "pytest-qt>=4.5.0,<5",
    "ruff>=0.15.22,<0.16",
]

[project.gui-scripts]
acd = "acd.desktop:main"

# ==========================================================
# SETUPTOOLS
# ==========================================================

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
acd = ["resources/styles/*.qss"]

[tool.setuptools.packages.find]
include = ["acd*"]
exclude = [
    "tests*",
    "data*",
    "logs*",
    "config*",
    "backups*",
    "docs*",
]

# ==========================================================
# BLACK
# ==========================================================

[tool.black]
line-length = 100
target-version = ["py314"]

# ==========================================================
# RUFF
# ==========================================================

[tool.ruff]
line-length = 100
target-version = "py314"

exclude = [
    "docs/ARCHITECTURE_GUIDE.py",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

ignore = [
    "E501",
]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true

# ==========================================================
# PYTEST
# ==========================================================

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
]

# ==========================================================
# DEPTRY
# ==========================================================

[tool.deptry]
ignore = []

# ==========================================================
# COVERAGE
# ==========================================================

[tool.coverage.run]
branch = true
source = [
    "acd",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2
fail_under = 85
